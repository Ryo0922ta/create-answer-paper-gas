<!DOCTYPE html>
<html><head><base target="_top"><style>
body { font: 14px Arial,sans-serif; color: #202124; padding: 16px; }
button { padding: 8px 14px; margin: 10px 8px 0 0; cursor: pointer; }
#status { white-space: pre-wrap; }
</style></head><body>
<p id="description">「<?= label ?>」（<?= range ?>）を出力から削除しますか？</p>
<div id="actions"><button id="remove" type="button">削除</button><button id="cancel" type="button">キャンセル</button></div>
<p id="status" role="status" aria-live="polite"></p>
<button id="close" type="button" hidden>閉じる</button>
<input id="operationId" type="hidden" value="<?= operationId ?>">
<script>
const byId = id => document.getElementById(id);
const operationId = byId('operationId').value;
byId('cancel').onclick = () => {
  byId('actions').hidden = true;
  google.script.run.withSuccessHandler(() => google.script.host.close())
    .withFailureHandler(() => google.script.host.close()).cancelDeletePart(operationId);
};
byId('close').onclick = () => google.script.host.close();
byId('remove').onclick = () => {
  byId('actions').hidden = true;
  byId('status').textContent = '削除中…';
  const started = performance.now();
  const timer = setTimeout(() => { byId('status').textContent = '削除に10秒以上かかっています。処理が続いていますのでお待ちください。'; }, 10000);
  google.script.run.withSuccessHandler(result => {
    clearTimeout(timer);
    const durationMs = Math.round(performance.now() - started);
    console.info(JSON.stringify({operation:'delete_part', event:'complete', durationMs}));
    byId('status').textContent = result + '\n削除処理の応答時間：' + durationMs + 'ms（目標：3500ms以内）';
    byId('close').hidden = false;
  }).withFailureHandler(error => {
    clearTimeout(timer);
    byId('status').textContent = '削除できませんでした：' + (error.message || String(error));
    byId('close').hidden = false;
  }).confirmDeletePart(operationId);
};
</script></body></html>
